
<!DOCTYPE html>
<html>
<head>
    <title>Exercise 2</title>
</head>
<body>
    <h1>Welcome to Django Application</h1>
    <p>Welcome you to the Home Page of our website</p>

    <h2>Student Details</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Department</th>
            <th>Email</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.age }}</td>
            <td>{{ student.department }}</td>
            <td>{{ student.email }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No student records found.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
